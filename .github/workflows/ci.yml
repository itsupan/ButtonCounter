name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so that `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy to Vercel
    # Gates the deploy on a green `test` job — this is what makes "tests run
    # before deployment" true rather than aspirational. The vars check keeps the
    # job skipped (not failed) until Vercel credentials are configured.
    needs: test
    if: github.event_name == 'push' && vars.VERCEL_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $code, retrying in 10s"
            sleep 10
          done
          echo "Health check never returned 200" >&2
          exit 1

      - name: Alias development to a stable URL
        # Deliberately after the health check: the fixed dev hostname should
        # never be repointed at a deployment that failed its probe.
        if: github.ref == 'refs/heads/development'
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" buttoncounter-dev.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }}
          echo "Aliased to https://buttoncounter-dev.vercel.app" >> "$GITHUB_STEP_SUMMARY"
