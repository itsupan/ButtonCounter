name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deployment is handled by Vercel's Git integration, not from here. What keeps
  # untested code out of production is branch protection on `main` requiring this
  # job — so the job NAME below is load-bearing: it is the status check context
  # the protection rule matches. Renaming it silently disables the gate.
  # See docs/DEPLOYMENT.md.
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so that `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit -- --run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
