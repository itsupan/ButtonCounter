name: Uptime

# Polls the production health endpoint. This is the whole monitoring story for
# now (no Sentry), so the check must reach the database — /api/health runs a real
# query rather than returning a static 200.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    name: Probe /api/health
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        id: probe
        run: |
          # Two attempts, so a single cold start or transient blip does not page anyone.
          for attempt in 1 2; do
            code=$(curl -s -m 20 -o /tmp/body.json -w '%{http_code}' "${{ vars.PRODUCTION_URL }}/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Healthy: $(cat /tmp/body.json)"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            [ $attempt -eq 1 ] && sleep 20
          done
          {
            echo "code=$code"
            echo "body<<EOF"
            cat /tmp/body.json 2>/dev/null || echo "(no body)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production health check failing';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime'
            });

            const body = [
              `Health probe of ${{ vars.PRODUCTION_URL }}/api/health failed.`,
              '',
              `HTTP status: \`${{ steps.probe.outputs.code }}\``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            // Comment on the existing alert rather than filing a duplicate every
            // 15 minutes for the duration of an outage.
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime']
              });
            }
